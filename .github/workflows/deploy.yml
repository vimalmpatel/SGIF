name: Deployment preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: python -m pip install --disable-pip-version-check ansible-core
      - name: Install required collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Check playbook syntax (no hosts contacted)
        run: ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook -i ansible/inventories/example.yml ansible/playbooks/site.yml --syntax-check
      - name: Check Ubuntu installer syntax (no hosts contacted)
        run: ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook -i ansible/inventories/example.yml ansible/playbooks/install_lab.yml --syntax-check
      - name: Explain deployment boundary
        run: echo "Preflight only. This workflow does not connect to or configure site hosts."
