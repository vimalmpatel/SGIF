services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SGIF_DB_USER: ${SGIF_DB_USER:?Set SGIF_DB_USER in .env}
      SGIF_DB_PASSWORD: ${SGIF_DB_PASSWORD:?Set SGIF_DB_PASSWORD in .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - sgif-database:/var/lib/postgresql/data
      - ./deployment/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak-db.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d sgif"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  identity:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in .env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    volumes:
      - ./deployment/keycloak/sgif-lab-realm.json:/opt/keycloak/data/import/sgif-lab-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deployment/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: lab
      DATABASE_URL: postgresql+psycopg://${SGIF_DB_USER:?Set SGIF_DB_USER in .env}:${SGIF_DB_PASSWORD:?Set SGIF_DB_PASSWORD in .env}@database:5432/sgif
      OIDC_ISSUER: http://localhost:8080/realms/sgif-lab
      OIDC_JWKS_URI: http://identity:8080/realms/sgif-lab/protocol/openid-connect/certs
      OIDC_AUDIENCE: sgif-api
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
      identity:
        condition: service_started

  web:
    build:
      context: application/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_KEYCLOAK_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      - api
      - identity

volumes:
  sgif-database: